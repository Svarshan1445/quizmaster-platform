services:
  - type: web
    name: quizmaster-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: quiz-db
      mountPath: /data
      sizeGB: 1
