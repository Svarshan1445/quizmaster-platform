<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" />

  <!-- Trophy Icon -->
  <path d="M20 18h24v10c0 6.627-5.373 12-12 12s-12-5.373-12-12V18z" fill="url(#goldGrad)" />
  <path d="M16 20c-2.5 0-4 1.5-4 4s1.5 4 4 4" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 20c2.5 0 4 1.5 4 4s-1.5 4-4 4" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Trophy Stem & Base -->
  <path d="M30 40h4v6h-4z" fill="url(#goldGrad)" />
  <rect x="22" y="46" width="20" height="4" rx="2" fill="url(#goldGrad)" />

  <!-- Star Sparkle -->
  <path d="M32 24l1.5 3 3.5.5-2.5 2.5.5 3.5-3-1.5-3 1.5.5-3.5-2.5-2.5 3.5-.5z" fill="#ffffff" filter="url(#glow)"/>
</svg>